spring.application.name=bidmart-auction
server.port=8083

# database configuration
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/bidmart_auction}
spring.datasource.username=${JDBC_DATABASE_USERNAME:postgres}
spring.datasource.password=${JDBC_DATABASE_PASSWORD:amimir}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# hikaricp connection pool (for neon db serverless)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=180000
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.keepalive-time=30000

# flyway
spring.flyway.enabled=true
spring.flyway.connect-retries=5
spring.flyway.connect-retries-interval=3

# thymeleaf
spring.thymeleaf.cache=false

spring.rabbitmq.template.retry.enabled=true
spring.rabbitmq.template.retry.initial-interval=1000ms
spring.rabbitmq.template.retry.max-attempts=3
spring.rabbitmq.template.retry.max-interval=10000ms
spring.rabbitmq.template.retry.multiplier=2.0
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true

# rabbitmq event broker configuration (CloudAMQP)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
spring.rabbitmq.ssl.enabled=${RABBITMQ_SSL_ENABLED:false}

# redis configuration (Upstash REDIS_URL)
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}

# service connectivity (API call external)
bidmart.wallet-service.url=${WALLET_SERVICE_URL}

# security configuration
jwt.secret=${JWT_SECRET:your_jwt_secret_key_at_least_256_bits_length_for_security}
springdoc.swagger-ui.path=/swagger-ui.html
