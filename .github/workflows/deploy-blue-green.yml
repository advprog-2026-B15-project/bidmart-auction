name: Continuous Deployment (Blue-Green)

on:
  workflow_run:
    workflows: ["Continuous Integration"]
    types:
      - completed
    branches:
      - main

jobs:
  deploy-blue-green:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Determine Target Environment
        id: set-target
        run: |
          CURRENT_ACTIVE="${{ vars.ACTIVE_ENV }}"
          
          if [ -z "$CURRENT_ACTIVE" ]; then
            echo "Error: Repository Variable ACTIVE_ENV is not set! Please create it in Settings > Variables."
            exit 1
          fi
          
          echo "Currently active environment is: $CURRENT_ACTIVE"
          
          if [ "$CURRENT_ACTIVE" == "blue" ]; then
            echo "Targeting GREEN environment for deployment."
            echo "TARGET_ENV=green" >> $GITHUB_ENV
          else
            echo "Targeting BLUE environment for deployment."
            echo "TARGET_ENV=blue" >> $GITHUB_ENV
          fi

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew clean bootJar 

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker build -t ghcr.io/$REPO_LOWER:latest .
          docker push ghcr.io/$REPO_LOWER:latest

      - name: Inject Target IP to Prometheus Config
        if: env.TARGET_ENV == 'blue'
        run: |
          sed -i 's/IP_EC2_GREEN/${{ secrets.GREEN_EC2_HOST }}/g' config/prometheus.yml

      - name: Copy docker-compose to Target EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.TARGET_ENV == 'blue' && secrets.BLUE_EC2_HOST || secrets.GREEN_EC2_HOST }}
          username: ${{ env.TARGET_ENV == 'blue' && secrets.BLUE_EC2_USERNAME || secrets.GREEN_EC2_USERNAME }}
          key: ${{ env.TARGET_ENV == 'blue' && secrets.BLUE_EC2_SSH_KEY || secrets.GREEN_EC2_SSH_KEY }}
          source: "docker-compose.yml,config/"
          target: "~/"

      - name: Deploy to Target EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.TARGET_ENV == 'blue' && secrets.BLUE_EC2_HOST || secrets.GREEN_EC2_HOST }}
          username: ${{ env.TARGET_ENV == 'blue' && secrets.BLUE_EC2_USERNAME || secrets.GREEN_EC2_USERNAME }}
          key: ${{ env.TARGET_ENV == 'blue' && secrets.BLUE_EC2_SSH_KEY || secrets.GREEN_EC2_SSH_KEY }}
          script: |
            if [ "${{ env.TARGET_ENV }}" == "blue" ]; then
              docker compose --profile monitoring pull
              docker compose --profile monitoring up -d
            else
              docker compose pull
              docker compose up -d
            fi


