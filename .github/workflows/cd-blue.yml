name: Deploy to Blue EC2

on:
  workflow_run:
    workflows:
      - "Continuous Integration"
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew clean bootJar 

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker build -t ghcr.io/$REPO_LOWER:latest .
          docker push ghcr.io/$REPO_LOWER:latest

      - name: Inject Green IP to Prometheus Config
        run: |
          sed -i 's/IP_EC2_GREEN/${{ secrets.GREEN_EC2_HOST }}/g' config/prometheus.yml

      - name: Copy docker-compose to Blue EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.BLUE_EC2_HOST }}
          username: ${{ secrets.BLUE_EC2_USERNAME }}
          key: ${{ secrets.BLUE_EC2_SSH_KEY }}
          source: "docker-compose.yml,config/"
          target: "~/"

      - name: Deploy to Blue EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.BLUE_EC2_HOST }}
          username: ${{ secrets.BLUE_EC2_USERNAME }}
          key: ${{ secrets.BLUE_EC2_SSH_KEY }}
          script: |
            docker compose --profile monitoring pull
            docker compose --profile monitoring up -d
